name: Bug report
description: Something does not work as it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report it. For a security problem, do not open an issue: use **Report a vulnerability** on the repository's **Security** tab (see `SECURITY.md`).

  - type: checkboxes
    id: checks
    attributes:
      label: Before you start
      options:
        - label: I searched the existing issues and found none about this.
          required: true

  - type: input
    id: version
    attributes:
      label: App version
      description: Shown in **Settings › About**, and on the first line of the copied technical logs.
      placeholder: "0.1.0"
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Desktop app
        - Docker
    validations:
      required: true

  - type: dropdown
    id: docker-access
    attributes:
      label: Docker access
      description: Only for Docker.
      options:
        - Plain HTTP (on your own network)
        - Behind an HTTPS reverse proxy (MINER_PUBLIC_URL)
    validations:
      required: false

  - type: input
    id: os
    attributes:
      label: Operating system
      description: For Docker, the system of the machine that runs it and its architecture.
      placeholder: "Windows 11, macOS 15, Ubuntu 24.04, Raspberry Pi OS (arm64)…"
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you saw, and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Technical logs
      description: |
        Open the **Technical logs** page, filter on the account concerned if there is one, click **Copy for a bug report** and paste the result here. The copy is redacted: tokens and passwords are removed. It still shows account and channel names: edit them out if you prefer.
      render: text
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Optional. Drag images here.
    validations:
      required: false
